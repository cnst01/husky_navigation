  # X: -13.670 a ~13 metros, Y: -10.462 a ~13 metros
  
  gps_points:
    # Waypoint 1: um pouco a frente
    - latitude: -30.000010
      longitude: -51.000010
      yaw: 0.0
    
    # Waypoint 2: para a esquerda
    - latitude: -30.000015
      longitude: -51.000010
      yaw: 1.57
    
    # Waypoint 3: para frente novamente
    - latitude: -30.000015
      longitude: -51.000020
      yaw: 0.0

navigation:
